name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: lint (fmt and interface are clean)
        run: |
          moon fmt
          moon info --target all
          git diff --exit-code

      - name: the documentation matches the showcase and the interfaces
        if: ${{ runner.os == 'Linux' }}
        run: |
          python3 scripts/gen_docs.py
          python3 scripts/gen_api.py
          git diff --exit-code docs/index.html README.md

      - name: the skills are valid
        if: ${{ runner.os == 'Linux' }}
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: ${{ runner.os == 'Linux' }}
        run: python3 scripts/check_snippets.py

      # The vectors hold the width and the splitting of every code point to two references.
      # Regenerating must not move them; the key vectors are left out because they come from
      # the machine's terminfo database.
      - name: the conformance vectors are what their references say
        if: ${{ runner.os == 'Linux' }}
        run: |
          python3 -m pip install --quiet --break-system-packages wcwidth==0.9.4 uniseg==0.10.1 regex==2025.9.18
          python3 scripts/gen_conformance.py --repo . --only widths,clusters
          moon fmt
          git diff --exit-code src/strip/width_vectors_wbtest.mbt src/strip/cluster_vectors_wbtest.mbt

      # The frames the library writes, drawn again by two terminal emulators it has no part
      # in: what they show has to be what the application meant to show.
      - name: two terminal emulators draw the frames the library writes
        if: ${{ runner.os == 'Linux' }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyte==0.8.2
          command -v tmux > /dev/null || sudo apt-get install -y tmux
          moon test --target native -p moonbitstack/moonetui/app 2>&1 | grep '^interop' > "$RUNNER_TEMP/frames.txt"
          python3 scripts/verify_terminals.py --in "$RUNNER_TEMP/frames.txt"
