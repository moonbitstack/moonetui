name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      # The database client is an example with a module of its own: its tests
      # run with the library's, and this draws a frame of its demo without a
      # tty, so a screen that panics or an empty grid fails the build.
      - name: the database client draws its demo
        if: ${{ runner.os == 'Linux' }}
        run: |
          out=$(moon run --target native dbmux/src/main -- --demo --headless --frames 3)
          echo "$out" | grep -q "main / customers"
          echo "$out" | grep -q "Ada"
          echo "$out" | grep -q "tab pane"

      # The save's old-value WHERE and the read-only refusal, each broken in turn: the test named
      # for each has to go red.
      - name: the database client's two safety checks are pinned by their tests
        if: ${{ runner.os == 'Linux' }}
        run: python3 scripts/check_dbmux_mutations.py

      - name: lint (fmt and interface are clean)
        run: |
          moon fmt
          moon info --target all
          git diff --exit-code

      - name: the documentation matches the showcase and the interfaces
        if: ${{ runner.os == 'Linux' }}
        run: |
          python3 scripts/gen_docs.py
          python3 scripts/gen_api.py
          git diff --exit-code docs/index.html README.md

      - name: the skills are valid
        if: ${{ runner.os == 'Linux' }}
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: ${{ runner.os == 'Linux' }}
        run: python3 scripts/check_snippets.py

      # The vectors hold the width and the splitting of every code point to two references.
      # Regenerating must not move them; the key vectors are left out because they come from
      # the machine's terminfo database.
      - name: the conformance vectors are what their references say
        if: ${{ runner.os == 'Linux' }}
        run: |
          python3 -m pip install --quiet --break-system-packages wcwidth==0.9.4 uniseg==0.10.1 regex==2025.9.18
          python3 scripts/gen_conformance.py --repo . --only widths,clusters
          moon fmt
          git diff --exit-code src/strip/width_vectors_wbtest.mbt src/strip/cluster_vectors_wbtest.mbt

      # The frames the library writes, drawn again by two terminal emulators it has no part
      # in: what they show has to be what the application meant to show. The demo is
      # checked frame by frame as well, key after key, so an interaction that lands on the
      # wrong row fails here and not only in a reader's terminal.
      - name: two terminal emulators draw the frames the library writes
        if: ${{ runner.os == 'Linux' }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyte==0.8.2
          command -v tmux > /dev/null || sudo apt-get install -y tmux

          MOONETUI_INTEROP=1 moon test --target native -p moonbitstack/moonetui/app > "$RUNNER_TEMP/app.txt" 2>&1 || {
            cat "$RUNNER_TEMP/app.txt"; exit 1; }
          grep '^interop' "$RUNNER_TEMP/app.txt" > "$RUNNER_TEMP/frames.txt"

          # Every program under examples that has a frame test: the demo, the
          # two games and the dashboard.
          for example in dbmux snake life game2048 pulse donut files top git read invaders blocks sweep sudoku cards board boxes prs tunes drift mon logs json; do
            MOONETUI_INTEROP=1 moon test --target native -p "moonbitstack/moonetui/examples/$example" > "$RUNNER_TEMP/$example.txt" 2>&1 || {
              cat "$RUNNER_TEMP/$example.txt"; exit 1; }
            grep '^interop' "$RUNNER_TEMP/$example.txt" >> "$RUNNER_TEMP/frames.txt"
          done

          # The jj client is a program of its own, so its frames are announced by
          # its own tests.
          MOONETUI_INTEROP=1 moon test --target native -p moonbitstack/mbtjj > "$RUNNER_TEMP/mbtjj.txt" 2>&1 || {
            cat "$RUNNER_TEMP/mbtjj.txt"; exit 1; }
          grep '^interop' "$RUNNER_TEMP/mbtjj.txt" >> "$RUNNER_TEMP/frames.txt"
          grep -c 'interop' "$RUNNER_TEMP/frames.txt"

          python3 scripts/verify_terminals.py --in "$RUNNER_TEMP/frames.txt"

      # The jj client against a repository it did not bring with it: jj is
      # installed from its own release, a repository is made in the runner, and
      # the window is asked for three frames.
      - name: the jj client reads a repository
        if: ${{ runner.os == 'Linux' }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jj.tar.gz" \
            https://github.com/jj-vcs/jj/releases/download/v0.47.1/jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz
          tar xzf "$RUNNER_TEMP/jj.tar.gz" -C "$RUNNER_TEMP" --strip-components=1
          export PATH="$RUNNER_TEMP:$PATH"
          export JJ_CONFIG="$RUNNER_TEMP/jjconfig.toml"
          printf 'user.name = "CI"\nuser.email = "ci@example.com"\n' > "$JJ_CONFIG"
          repo="$RUNNER_TEMP/repo"
          mkdir -p "$repo" && cd "$repo"
          jj git init
          echo one > a.txt
          jj describe -m 'feat: a first line'
          jj new -m 'fix: a second line'
          echo two >> a.txt
          jj bookmark create main -r @
          cd "$GITHUB_WORKSPACE"
          out=$(moon run --target native mbtjj/src/main -- "$repo" --headless --frames 3)
          echo "$out"
          echo "$out" | grep -q "feat: a first line"
          echo "$out" | grep -q "fix: a second line"
          echo "$out" | grep -q "main"
          # A path that is not a repository is refused with jj's own words.
          if moon run --target native mbtjj/src/main -- "$RUNNER_TEMP" --headless --frames 1; then
            echo "a directory that is not a repository was accepted"; exit 1
          fi

  # The database client against real servers — Redis, PostgreSQL, MySQL and SQL
  # Server: the keys and tables it lists, what it opens and what its console runs
  # are all server answers, not fixtures.
  database:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dbmux
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dbmux
          MYSQL_DATABASE: shop
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdbmux"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Dbmux-pass1"
        ports:
          - 1433:1433
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: moon update

      - name: seed redis
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli set greeting hello
          docker exec ${{ job.services.redis.id }} redis-cli hset user:1 name Ada city London
          docker exec ${{ job.services.redis.id }} redis-cli rpush queue a b c

      - name: the client lists the keys and opens one
        run: |
          out=$(moon run --target native dbmux/src/main -- "redis://127.0.0.1:6379/0" --headless --frames 3)
          echo "$out"
          echo "$out" | grep -q "greeting"
          echo "$out" | grep -q "hash"

      - name: the client's console runs a command
        run: |
          out=$(moon run --target native dbmux/src/main -- "redis://127.0.0.1:6379/0" --headless --frames 10 --keys '\tiHGETALL user:1\x12')
          echo "$out"
          echo "$out" | grep -q "Ada"
          echo "$out" | grep -q "London"

      # One table in each SQL server, so the tree has something of its own to list.
      - name: seed the SQL servers
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d shop \
            -c "create table customers (id int primary key, name text); insert into customers values (1, 'Ada')"
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pdbmux shop \
            -e "create table customers (id int primary key, name varchar(40)); insert into customers values (1, 'Ada')"
          for i in $(seq 60); do
            docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Dbmux-pass1' -Q "select 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Dbmux-pass1' \
            -Q "create database shop; exec('use shop; create table customers (id int primary key, name nvarchar(40)); insert into customers values (1, N''Ada'')')"

      - name: the client lists each SQL server's tables and opens one
        run: |
          for dsn in "postgres://postgres:dbmux@127.0.0.1:5432/shop" \
                     "mysql://root:dbmux@127.0.0.1:3306/shop" \
                     "sqlserver://sa:Dbmux-pass1@127.0.0.1:1433/shop"; do
            out=$(moon run --target native dbmux/src/main -- "$dsn" --headless --frames 3)
            echo "$out"
            echo "$out" | grep -q "customers"
          done

      # The keys a reader presses: enter opens the only table, `l` moves to the
      # name column, `e` edits it, three rub-outs clear "Ada", enter applies,
      # C-s previews and two yesses save, `x` writes the page out as CSV. A `|`
      # starts a new chunk, one per frame, so the edit lands on the open table.
      - name: the client changes a cell on each SQL server and exports the page
        run: |
          for dsn in "postgres://postgres:dbmux@127.0.0.1:5432/shop" \
                     "mysql://root:dbmux@127.0.0.1:3306/shop" \
                     "sqlserver://sa:Dbmux-pass1@127.0.0.1:1433/shop"; do
            out=$(moon run --target native dbmux/src/main -- "$dsn" --headless \
              --frames 24 --keys '\x0d|l|e|\x7f\x7f\x7fAda L\x0d|\x13|y|y|x')
            echo "$out"
            test -f customers.csv || { echo "no export for $dsn"; exit 1; }
            head -3 customers.csv
            grep -q "Ada L" customers.csv
            rm -f customers.csv
          done

      - name: the servers hold what the client wrote
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d shop \
            -tAc "select name from customers where id = 1" | grep -q "Ada L"
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pdbmux shop -N -e \
            "select name from customers where id = 1" | grep -q "Ada L"
          docker exec ${{ job.services.sqlserver.id }} \
            /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Dbmux-pass1' \
            -d shop -h -1 -Q "set nocount on; select name from customers where id = 1" \
            | grep -q "Ada L"

      - name: the client's SQLite demo draws, changes a cell and exports
        run: |
          out=$(moon run --target native dbmux/src/main -- --demo --headless --frames 3)
          echo "$out" | grep -q "customers"
          out=$(moon run --target native dbmux/src/main -- --demo --headless \
            --frames 24 --keys '\x0d|l|e|\x7f\x7f\x7fAda L\x0d|\x13|y|y|x')
          echo "$out" | grep -q "wrote customers.csv"
          test -f customers.csv
          grep -q "Ada L" customers.csv
          rm -f customers.csv
