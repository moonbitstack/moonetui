name: Docs

# Publishes the documentation site to GitHub Pages whenever it changes on
# master. The site under docs/ is a static page with no build step, so the
# workflow only uploads it and asks Pages to serve the artifact.

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: configure pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
